[package]
name = "qft_orchestration_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "common"
path = "src/lib.rs"

[[bin]]
name = "exact_checks"
path = "src/bin/exact_checks.rs"

[[bin]]
name = "nonlinear_bsd"
path = "src/bin/nonlinear_bsd.rs"

[[bin]]
name = "policy_certificate"
path = "src/bin/policy_certificate.rs"

[[bin]]
name = "generated_effective_memory"
path = "src/bin/generated_effective_memory.rs"

[[bin]]
name = "agentic_routing"
path = "src/bin/agentic_routing.rs"

[[bin]]
name = "continuous_baselines"
path = "src/bin/continuous_baselines.rs"

[[bin]]
name = "discrete_benchmarks"
path = "src/bin/discrete_benchmarks.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
